version: "3.9"

services:
  server:
    build: .

    container_name: finpilot-server

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    depends_on:
      - mongo

  mongo:
    image: mongo:8

    container_name: finpilot-mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: